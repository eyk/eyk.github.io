<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07383d">
  <meta name="description" content="Sie haben das Ende des Internets erreicht. Zeit für die Welt da draußen.">
  <title>Das Ende des Internets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307383d'/%3E%3Cpath d='M14 24h36v12H14z' fill='%23eabb78'/%3E%3Cpath d='m16 36 12-12m8 12 12-12' stroke='%23944936' stroke-width='7'/%3E%3Cpath d='M18 36v16m28-16v16' stroke='%23eabb78' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    html { color-scheme: dark; background: #07383d; }
    body { color: #fff7e8; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .scene { position: fixed; inset: 0; height: 100vh; height: 100dvh; isolation: isolate; overflow: hidden; }
    .landscape { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 65%; z-index: -2; }
    .scene::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgb(3 24 28 / 22%), transparent 55%, rgb(3 24 28 / 60%)); }
    .message { position: absolute; top: max(7vh, env(safe-area-inset-top)); top: max(7svh, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); right: max(20px, env(safe-area-inset-right)); text-align: center; }
    h1 { margin: 0; font-weight: 650; }
    .intro, .outro { display: block; font-size: clamp(12px, min(3vw, 2svh), 19px); font-weight: 450; letter-spacing: .14em; }
    .intro { margin-bottom: clamp(12px, 2.5svh, 28px); }
    .title { display: block; font-size: clamp(36px, min(14vw, 13svh), 152px); line-height: .94; letter-spacing: -.065em; font-weight: 750; text-wrap: balance; }
    .outro { margin-top: clamp(12px, 2.5svh, 28px); }
    .afterword { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: max(20px, env(safe-area-inset-left)); right: max(20px, env(safe-area-inset-right)); margin: 0; text-align: center; font-size: clamp(11px, min(2.8vw, 2svh), 14px); line-height: 1.5; letter-spacing: .035em; color: #fff1d8; text-shadow: 0 1px 12px #06292e; }
    @media (max-height: 400px) {
      .message { top: max(16px, env(safe-area-inset-top)); }
      .title { font-size: clamp(22px, min(12vw, 13svh), 52px); }
      .intro, .outro { font-size: 11px; letter-spacing: .1em; }
      .intro { margin-bottom: 8px; }
      .outro { margin-top: 8px; }
      .afterword { bottom: max(12px, env(safe-area-inset-bottom)); font-size: 11px; }
    }
    @media (max-height: 260px) { .afterword { display: none; } }
  </style>
</head>
<body>
  <main class="scene">
    <img class="landscape" src="assets/end-of-internet.webp" alt="" width="1672" height="941" fetchpriority="high">
    <div class="message">
      <h1><span class="intro">Sie haben das</span> <span class="title">Ende des<br>Internets</span> <span class="outro">erreicht.</span></h1>
    </div>
    <p class="afterword">Zeit für die Welt da draußen.</p>
  </main>
</body>
</html>
